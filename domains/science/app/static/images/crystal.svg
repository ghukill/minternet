<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background jar -->
  <rect x="50" y="60" width="100" height="120" fill="none" stroke="#87CEEB" stroke-width="3" rx="5"/>
  <rect x="45" y="55" width="110" height="15" fill="#B0C4DE" rx="3"/>

  <!-- Solution/water -->
  <rect x="53" y="80" width="94" height="97" fill="#E0F7FA" opacity="0.5"/>

  <!-- Crystal structure - main crystal -->
  <polygon points="100,90 85,130 100,170 115,130" fill="#9370DB" opacity="0.8"/>
  <polygon points="100,90 115,130 130,115 115,95" fill="#8A2BE2" opacity="0.7"/>
  <polygon points="100,90 85,130 70,115 85,95" fill="#BA55D3" opacity="0.7"/>

  <!-- Smaller crystals -->
  <polygon points="75,140 68,155 75,170 82,155" fill="#DDA0DD" opacity="0.6"/>
  <polygon points="125,135 118,150 125,165 132,150" fill="#DA70D6" opacity="0.6"/>

  <!-- String from top -->
  <line x1="100" y1="55" x2="100" y2="90" stroke="#333" stroke-width="1"/>

  <!-- Sparkles -->
  <circle cx="90" cy="110" r="2" fill="white" opacity="0.8"/>
  <circle cx="110" cy="125" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="105" cy="145" r="1" fill="white" opacity="0.6"/>
</svg>
