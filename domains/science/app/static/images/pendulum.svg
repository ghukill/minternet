<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Support bar -->
  <rect x="20" y="20" width="160" height="8" fill="#8B4513"/>

  <!-- Pendulum 1 -->
  <line x1="40" y1="28" x2="35" y2="100" stroke="#333" stroke-width="1"/>
  <circle cx="35" cy="105" r="8" fill="#4169E1"/>

  <!-- Pendulum 2 -->
  <line x1="60" y1="28" x2="62" y2="110" stroke="#333" stroke-width="1"/>
  <circle cx="62" cy="115" r="8" fill="#32CD32"/>

  <!-- Pendulum 3 -->
  <line x1="80" y1="28" x2="85" y2="120" stroke="#333" stroke-width="1"/>
  <circle cx="85" cy="125" r="8" fill="#FFD700"/>

  <!-- Pendulum 4 -->
  <line x1="100" y1="28" x2="100" y2="130" stroke="#333" stroke-width="1"/>
  <circle cx="100" cy="135" r="8" fill="#FF6347"/>

  <!-- Pendulum 5 -->
  <line x1="120" y1="28" x2="115" y2="120" stroke="#333" stroke-width="1"/>
  <circle cx="115" cy="125" r="8" fill="#9370DB"/>

  <!-- Pendulum 6 -->
  <line x1="140" y1="28" x2="138" y2="110" stroke="#333" stroke-width="1"/>
  <circle cx="138" cy="115" r="8" fill="#20B2AA"/>

  <!-- Pendulum 7 -->
  <line x1="160" y1="28" x2="165" y2="100" stroke="#333" stroke-width="1"/>
  <circle cx="165" cy="105" r="8" fill="#FF69B4"/>

  <!-- Wave indication lines -->
  <path d="M30,160 Q60,145 90,160 Q120,175 150,160 Q170,150 180,160"
        stroke="#DDD" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
</svg>
