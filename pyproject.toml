[project]
name = "minternet"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "click",
]

[project.scripts]
minternet = "minternet.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
