<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Minternet</title>
</head>
<body>
    <h1>The Minternet</h1>
    <ul>
    {% for site in sites %}
        <li><a href="{{ site.url }}">{{ site.name }}</a>{% if site.description %} &mdash; {{ site.description }}{% endif %}</li>
    {% else %}
        <li>No sites configured.</li>
    {% endfor %}
    </ul>
</body>
</html>
